<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found — Maharashtra Health Connect | Kacchodis</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background: var(--bg-dark);
    }
    .error-container {
      background: var(--bg-panel);
      padding: 40px;
      border-radius: 12px;
      border: var(--glass-border);
      max-width: 500px;
      width: 90%;
    }
    h1 {
      font-size: 4rem;
      color: var(--color-red);
      margin-bottom: 10px;
    }
    p {
      color: var(--text-muted);
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: var(--color-green);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #059669; /* Darker green */
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <i class="fas fa-heartbeat" style="font-size:3rem; color:var(--text-muted); margin-bottom:20px;"></i>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The healthcare resource you are looking for does not exist or has been moved. Let's get you back to the main dashboard.</p>
    <a href="/" class="btn"><i class="fas fa-home"></i> Return to Dashboard</a>
  </div>
</body>
</html>
